# this workflow will run on every pr to make sure the project is following the guidelines
name: CI

on:
  pull_request:
    branches: ["*"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Run ESLint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  prettier:
    runs-on: ubuntu-latest
    name: Run Prettier
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  tsc:
    runs-on: ubuntu-latest
    name: Run Typechecker
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    name: Run Tests
    # The service layer is tested against a real Postgres rather than a mocked
    # Prisma client: row locks, `FOR UPDATE`, raw SQL and transaction rollback
    # are most of what these tests assert, and none of them survive a mock.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexstock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexstock_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/nexstock_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Apply migrations
        run: pnpm db:migrate
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    name: Run Build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    name: Run E2E
    # Drives the real app in a browser: a production build, a real Postgres and
    # a real Better Auth session. Covers what the service tests cannot see —
    # that the routers and screens are wired to the services at all.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexstock_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexstock_e2e
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/nexstock_e2e
      # Without this Better Auth answers requests from the e2e port as an
      # unknown host and every sign-in 500s.
      BETTER_AUTH_URL: http://127.0.0.1:3100
      BETTER_AUTH_SECRET: ci-e2e-secret-0123456789012345678901234567890123
      RESEND_API_KEY: re_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Prepare the database
        run: pnpm db:migrate && pnpm db:seed
      - name: Build
        run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
